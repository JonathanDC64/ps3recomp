# Builds the runtime on Linux and runs every Linux test set: one job per compiler, each build made once and every
# test that needs it run in the same job.
#
# Linux was the last platform with no CI and no evidence: the POSIX paths were
# there, README listed the whole column as "untested", and nobody had ever run
# a compiler over it. Two real defects were sitting in that gap -- an
# Apple-only QueryPerformanceCounter shim reached from a shared translation
# unit, and a Darwin-only pthread_threadid_np called from the POSIX branch of
# win32_compat.h. This job is what stops the next two from accumulating.
#
# Both compilers, deliberately. GCC accepted the pthread_threadid_np call as an
# implicit declaration and produced an archive that would only have failed when
# something finally linked it; Clang rejected it outright. A pull request runs
# clang, Release (the stricter compiler); a push to master and a manual run add
# gcc and both Debug builds.
#
# The builds, in the order the job makes them:
#   build-routes  the portable renderer (PS3RECOMP_RSX_HAL) and today's D3D12 renderer on vkd3d
#                 (PS3RECOMP_RSX_D3D12_VKD3D) in one runtime: the GPU layer's contract, null, spv and Vulkan
#                 backend tests, the core on the synthetic scenes on the null and Vulkan routes (lavapipe, Xvfb,
#                 the validation layer on: any message fails), once per GPU_CAP_* fallback, and the Vulkan
#                 start's fallback to today's renderer on vkd3d. Release only.
#   build-vkd3d   today's D3D12 renderer on vkd3d alone: the smoke title presents through it. Release only.
#   build-hal     the portable renderer without vkd3d, as a Linux build without it has it: its tests that need
#                 no display. Release, on a push to master or a manual run only.
#   build         the runtime as a port links it today (both renderer options off): the archive's symbols, the
#                 lifter suites, the smoke title and the game template on the null backend's headless software
#                 path (no GPU, no display), the POSIX host's scenes, and the self-contained tests.
#   build-vulkan  the opt-in Vulkan RSX backend (PS3RECOMP_RSX_VULKAN): every ps3recomp_host scene on lavapipe,
#                 on the fixed-function path and on the draw engine under the validation layer. Release only.
#   build-codec   cellSail's movies, cellVdec and cellPamf with FFmpeg loaded at run time.
#
# The portable renderer's builds come first, before the shader tools are installed: a system glslang found at
# configure time turns the spv target off (cmake/gpu_deps.cmake), and the configure checks below say so if it did.
# windows.yml builds both renderer options on Windows; macos.yml runs nightly.
name: Linux

on:
  push:
    branches: [ master ]
    paths-ignore: [ 'docs/**', '**.md' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new commit on a pull request (or a new push to master) cancels the run it replaces.
concurrency:
  group: linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux x64 (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler: ${{ github.event_name == 'pull_request' && fromJSON('["clang"]') || fromJSON('["gcc", "clang"]') }}
        build_type: ${{ github.event_name == 'pull_request' && fromJSON('["Release"]') || fromJSON('["Debug", "Release"]') }}
    env:
      # Built from its release tarball: Ubuntu packages 1.2, which has no HLSL compiler, and the backend compiles
      # its shaders with vkd3d's D3DCompile. The build is cached on the version.
      VKD3D_VERSION: "2.1"
      VKD3D_SHA256: 7510146aff2adfb4ae07ab890701a607e5ff7c66e57100cfc9f630ec92eeda6a
      # The prefix is inside the workspace: actions/cache refuses a path with '..' in it, and saved nothing while these were beside it.
      VKD3D_PREFIX: ${{ github.workspace }}/.ci-cache/vkd3d
      # The GPU layer's pinned sources (cmake/gpu_deps.cmake), cached on that file.
      GPU_SRC: ${{ github.workspace }}/.ci-cache/gpu-src
      # sccache, pinned and checked (the release's size and SHA-256 from GitHub's asset list).
      SCCACHE_VERSION: v0.18.0
      SCCACHE_ARCHIVE_SIZE: '9730540'
      SCCACHE_ARCHIVE_SHA256: 45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # SDL2 is not optional off Windows: cellPad and cellAudio select their SDL2 backends unconditionally there,
      # and CMakeLists.txt hard-fails without it. vkd3d's build needs flex, bison, Perl's JSON module and the SPIR-V
      # headers; the Vulkan headers and loader build and run it; lavapipe is in mesa-vulkan-drivers, the validation
      # layer is its own package; Xvfb is the display the windows open on.
      - name: Install dependencies
        id: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config clang libsdl2-dev libvulkan-dev libvulkan1 \
            mesa-vulkan-drivers vulkan-validationlayers flex bison libjson-perl spirv-headers xvfb

      # sccache for the configuration a pull request runs (clang, Release): every CMake configure below takes it
      # from CMAKE_<LANG>_COMPILER_LAUNCHER. Most of the build is glslang and SPIRV-Tools, which never change
      # between pins. Its cache comes from the newest master entry and is saved from master pushes only (at the
      # end), one key per commit, so a day of merges stays small and the caches every run reads stay.
      - name: sccache
        id: sccache
        if: matrix.compiler == 'clang' && matrix.build_type == 'Release'
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-all-errors -o sccache.tar.gz \
            "https://github.com/mozilla/sccache/releases/download/$SCCACHE_VERSION/sccache-$SCCACHE_VERSION-x86_64-unknown-linux-musl.tar.gz"
          [ "$(stat -c %s sccache.tar.gz)" = "$SCCACHE_ARCHIVE_SIZE" ] || { echo "::error::sccache.tar.gz has the wrong size"; exit 1; }
          echo "$SCCACHE_ARCHIVE_SHA256  sccache.tar.gz" | sha256sum -c -
          tar xzf sccache.tar.gz
          d="$RUNNER_TEMP/sccache-$SCCACHE_VERSION-x86_64-unknown-linux-musl"
          [ -x "$d/sccache" ] || { echo "::error::no sccache in the archive"; exit 1; }
          echo "$d" >> "$GITHUB_PATH"
          {
            echo "SCCACHE_DIR=$GITHUB_WORKSPACE/.ci-cache/sccache"
            echo "SCCACHE_CACHE_SIZE=1G"
            echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          } >> "$GITHUB_ENV"

      - name: Restore sccache's cache
        if: steps.sccache.outcome == 'success'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.ci-cache/sccache
          key: sccache-${{ runner.os }}-clang-Release-${{ github.sha }}
          restore-keys: sccache-${{ runner.os }}-clang-Release-

      - name: Cache vkd3d
        if: matrix.build_type == 'Release'
        id: vkd3d-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.VKD3D_PREFIX }}
          key: vkd3d-${{ env.VKD3D_VERSION }}-${{ runner.os }}-ubuntu-24.04-v1

      - name: Build vkd3d
        id: vkd3d
        if: matrix.build_type == 'Release' && steps.vkd3d-cache.outputs.cache-hit != 'true'
        run: |
          unset CC CXX   # the system compiler, as for both matrix entries before: one cache serves both
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://dl.winehq.org/vkd3d/source/vkd3d-$VKD3D_VERSION.tar.xz"
          echo "$VKD3D_SHA256  vkd3d-$VKD3D_VERSION.tar.xz" | sha256sum -c -
          tar xf "vkd3d-$VKD3D_VERSION.tar.xz"
          cd "vkd3d-$VKD3D_VERSION"
          ./configure -q --prefix="$VKD3D_PREFIX" --disable-doxygen-doc
          make -s -j"$(nproc)"
          make -s install

      # ---- build-routes: the portable renderer and today's D3D12 renderer on vkd3d, one runtime -------------

      # FetchContent clones Vulkan-Headers, SPIRV-Headers, SPIRV-Tools and glslang by commit, so not shallow:
      # about 3.5 of the configure's 3.7 minutes. A hit hands the cached copies to each configure below
      # through FetchContent's FETCHCONTENT_SOURCE_DIR_* (GPU_SRC_ARGS); a miss clones as before, and the step
      # after the configure keeps the sources (no .git: their builds take their versions from their own files).
      - name: Cache the GPU layer's sources
        if: matrix.build_type == 'Release'
        id: gpu-src
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.GPU_SRC }}
          key: gpu-src-${{ runner.os }}-${{ hashFiles('cmake/gpu_deps.cmake') }}-v1

      - name: The GPU layer's sources from the cache
        if: steps.gpu-src.outputs.cache-hit == 'true'
        run: |
          args=
          for n in vulkan_headers spirv_headers spirv_tools glslang; do
            [ -f "$GPU_SRC/$n/CMakeLists.txt" ] || { echo "::error::the cached $n has no CMakeLists.txt"; exit 1; }
            args="$args -DFETCHCONTENT_SOURCE_DIR_${n^^}=$GPU_SRC/$n"
          done
          echo "GPU_SRC_ARGS=$args" >> "$GITHUB_ENV"

      # Both renderers in one runtime: the configure must say so for each, and the spv target must be on.
      - name: Both routes, configure
        id: routes_cfg
        if: matrix.build_type == 'Release'
        run: |
          export PKG_CONFIG_PATH="$VKD3D_PREFIX/lib/pkgconfig"
          cmake -S . -B build-routes -G Ninja -DCMAKE_BUILD_TYPE=Release -DPS3RECOMP_RSX_HAL=ON \
            -DPS3RECOMP_RSX_D3D12_VKD3D=ON $GPU_SRC_ARGS | tee configure-routes.log
          grep -q "D3D12: *RSX backend on vkd3d $VKD3D_VERSION" configure-routes.log
          grep -q "Renderer: *the GPU layer's Vulkan backend" configure-routes.log
          grep -q "Renderer: *the compile service's spv target" configure-routes.log

      # Never in the way: a copy that fails is removed, so no half copy is saved, and the job goes on.
      - name: Keep the GPU layer's sources for the cache
        if: steps.gpu-src.outputs.cache-hit != 'true' && steps.routes_cfg.outcome == 'success'
        continue-on-error: true
        run: |
          trap 'rm -rf "$GPU_SRC"' ERR
          for n in vulkan_headers spirv_headers spirv_tools glslang; do
            mkdir -p "$GPU_SRC/$n"
            tar -C "build-routes/_deps/$n-src" --exclude=.git -cf - . | tar -C "$GPU_SRC/$n" -xf -
          done
          du -sh "$GPU_SRC"/*

      - name: Both routes, build
        id: routes_build
        if: matrix.build_type == 'Release'
        run: >
          cmake --build build-routes --target ps3recomp_runtime test_gpu_contract test_gpu_null test_gpu_sc_spv
          test_gpu_vk test_rsx_synth test_rsx_out

      # The contract is plain C99 that C++ includes as well, built as both with -Wpedantic -Werror: nothing in the
      # headers may be a Windows or compiler extension. The null backend's test: its operation stream's hash
      # against a golden. The spv target's: the seeded generator's programs and the built-in passes compile,
      # validate, bind where the Vulkan backend's layout says, and compile to the same bytes twice.
      - name: Run the contract, null backend and spv target tests
        if: ${{ !cancelled() && matrix.build_type == 'Release' && steps.routes_build.outcome == 'success' }}
        env:
          LD_LIBRARY_PATH: ${{ env.VKD3D_PREFIX }}/lib
        run: |
          ctest --test-dir build-routes -R gpu_contract --output-on-failure --no-tests=error
          ctest --test-dir build-routes -R gpu_null --output-on-failure --no-tests=error
          ctest --test-dir build-routes -R gpu_sc_spv --output-on-failure --no-tests=error

      # The switch's choice against its stand-ins, as Linux builds it (-V: each case's line).
      - name: Run the route switch's test
        if: ${{ !cancelled() && matrix.build_type == 'Release' && steps.routes_build.outcome == 'success' }}
        env:
          LD_LIBRARY_PATH: ${{ env.VKD3D_PREFIX }}/lib
        run: ctest --test-dir build-routes -R rsx_out -V --no-tests=error

      # The new path's core on the null route over synthetic scenes, through the switch, in two processes: each
      # scene's stream hash against its golden (the same goldens as Windows: a hash that differs here is a
      # portability bug in the core), with no failed check.
      - name: Run the core on the synthetic scenes (null route, through the switch)
        if: ${{ !cancelled() && matrix.build_type == 'Release' && steps.routes_build.outcome == 'success' }}
        env:
          LD_LIBRARY_PATH: ${{ env.VKD3D_PREFIX }}/lib
        run: ctest --test-dir build-routes -R rsx_synth -V --no-tests=error

      # The Vulkan backend's test on lavapipe, Mesa's CPU device: the test picks the CPU device and turns the
      # validation layer on itself. Then again with every cap off (RSX_VK_MASK): every fallback at once.
      - name: Run the Vulkan backend's test (lavapipe, validation on)
        if: ${{ !cancelled() && matrix.build_type == 'Release' && steps.routes_build.outcome == 'success' }}
        env:
          LD_LIBRARY_PATH: ${{ env.VKD3D_PREFIX }}/lib
        run: |
          ctest --test-dir build-routes -R gpu_vk --output-on-failure --no-tests=error
          RSX_VK_MASK=0xFFFFFF ctest --test-dir build-routes -R gpu_vk --output-on-failure --no-tests=error

      # The Vulkan route through the switch, in the core's SDL window on Xvfb, the validation layer on with
      # synchronization validation: every frame plays, no validation message, and the switch's own line names the
      # route (a start that fell back to today's renderer would play the scenes too). lavapipe is the only device.
      - name: Run the core on the synthetic scenes (Vulkan route, through the switch)
        if: ${{ !cancelled() && matrix.build_type == 'Release' && steps.routes_build.outcome == 'success' }}
        working-directory: build-routes
        env:
          LD_LIBRARY_PATH: ${{ env.VKD3D_PREFIX }}/lib
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          mkdir -p routes.out
          xvfb-run -a -s "-screen 0 1920x1080x24" ./test_rsx_synth --route vulkan --keep --out routes.out/vulkan
          grep -F "[rsx_out] route vulkan (the new path on its Vulkan backend)" routes.out/vulkan/a/log.txt

      # The device's GPU_CAP_* bits (gpu.h), as the backend's test prints them; then the scenes once per bit it
      # has, with that bit off (RSX_VK_MASK: its fallback), and once with every bit off. A bit the device lacks has
      # no fallback to try here. Each run must have played on the Vulkan route, not fallen back to today's
      # renderer. Every run is listed; the step fails if any did.
      - name: Run the core on the synthetic scenes with each cap off
        if: ${{ !cancelled() && matrix.build_type == 'Release' && steps.routes_build.outcome == 'success' }}
        working-directory: build-routes
        env:
          LD_LIBRARY_PATH: ${{ env.VKD3D_PREFIX }}/lib
          SDL_AUDIODRIVER: dummy
        run: |
          caps=$(./test_gpu_vk | sed -n 's/.*, caps 0x\([0-9A-Fa-f]*\),.*/\1/p' | head -1)
          [ -n "$caps" ] || { echo "no caps line from test_gpu_vk"; exit 1; }
          echo "device caps 0x$caps"
          masks=""
          for b in $(seq 0 23); do
            if [ $(( 0x$caps >> b & 1 )) = 1 ]; then masks="$masks $(printf '0x%X' $((1 << b)))"; fi
          done
          masks="$masks 0xFFFFFF"
          # To come here, one more run each, once they land (ps3recomp #194, lane V5v):
          #   --env RSX_CLAMP_FORM=vs        the vertex-shader clamp
          #   --env RSX_DEPTH_FORMAT=d32s8   D32S8 depth
          mkdir -p masks.out
          fail=0; table=""
          for m in $masks; do
            out=masks.out/$m
            if xvfb-run -a -s "-screen 0 1920x1080x24" ./test_rsx_synth --route vulkan --keep --out "$out" \
                 --env RSX_VK_MASK=$m > "$m.txt" 2>&1 \
               && grep -qF "[rsx_out] route vulkan (the new path on its Vulkan backend)" "$out/a/log.txt" \
               && ! grep -q "\[D3D12\] vkd3d: llvmpipe" "$out/a/log.txt"; then
              table="$table\n  RSX_VK_MASK $m: pass"
            else
              table="$table\n  RSX_VK_MASK $m: FAIL"; fail=1
              cat "$m.txt"
            fi
            tail -1 "$m.txt"
          done
          printf "the fallbacks:$table\n"
          exit $fail

      # A Vulkan start that fails at each step the core names (RSX_FAIL_START_AT), and one with a start mark left,
      # must run today's renderer on vkd3d in the same process; it plays the same scenes. Every run is listed; the
      # step fails if any did.
      - name: Run the Vulkan start's fallback to today's renderer (each step, and a mark left)
        if: ${{ !cancelled() && matrix.build_type == 'Release' && steps.routes_build.outcome == 'success' }}
        working-directory: build-routes
        env:
          LD_LIBRARY_PATH: ${{ env.VKD3D_PREFIX }}/lib
          SDL_AUDIODRIVER: dummy
        run: |
          mkdir -p routes.out
          fail=0; table=""
          for s in loader instance adapter features device window "swap chain" targets shaders rings mark; do
            out="routes.out/fallback-${s// /_}"
            if xvfb-run -a -s "-screen 0 1920x1080x24" ./test_rsx_synth --route vulkan --fallback "$s" --keep \
                 --out "$out" > "$out.txt" 2>&1 \
               && grep -q "\[D3D12\] vkd3d: llvmpipe" "$out/a/log.txt" \
               && ! grep -q "the failed start's window" "$out/a/log.txt"; then
              table="$table\n  $s: pass"
            else
              table="$table\n  $s: FAIL"; fail=1
              cat "$out.txt"
            fi
            tail -1 "$out.txt"
            grep -F "[rsx_out] route" "$out/a/log.txt" || true
          done
          printf "the fallbacks:$table\n"
          exit $fail

      # On a failure: the children's logs, the first one's stream dump (dump.txt) and the scenes' captures.
      - name: Keep the portable renderer's output
        if: failure() && matrix.build_type == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rsx-routes-linux-${{ matrix.compiler }}
          path: |
            build-routes/routes.out/
            build-routes/masks.out/
            build-routes/test_rsx_synth.out/
          if-no-files-found: ignore

      # ---- build-vkd3d: today's D3D12 renderer on vkd3d alone ----------------------------------------------

      # The backend a title takes on Linux today: rsx_d3d12_backend.c, the same file Windows builds, on vkd3d
      # (Wine's D3D12 on Vulkan) in an SDL window, with the DXGI half from rsx_vkd3d_dxgi.c.
      - name: D3D12 on vkd3d, configure and build
        id: vkd3d_build
        if: ${{ !cancelled() && matrix.build_type == 'Release' && steps.deps.outcome == 'success' && steps.vkd3d.outcome != 'failure' }}
        run: |
          export PKG_CONFIG_PATH="$VKD3D_PREFIX/lib/pkgconfig"
          cmake -S . -B build-vkd3d -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPS3RECOMP_RSX_D3D12_VKD3D=ON | tee configure-vkd3d.log
          grep -q "D3D12: *RSX backend on vkd3d $VKD3D_VERSION" configure-vkd3d.log
          cmake --build build-vkd3d --target ps3recomp_runtime ps3recomp_boot_smoke

      # The smoke title (below) again, this time presenting through the D3D12 backend: three frames cleared and
      # flipped through the FIFO, on lavapipe, in an SDL window on Xvfb. Exit 0 is the title's own verdict; the
      # greps make sure it was this backend on vkd3d that presented them, not a fallback.
      - name: Run the PPU boot smoke title (D3D12 on vkd3d)
        if: ${{ !cancelled() && matrix.build_type == 'Release' && steps.vkd3d_build.outcome == 'success' }}
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          export LD_LIBRARY_PATH="$VKD3D_PREFIX/lib"
          test -x build-vkd3d/ps3recomp_boot_smoke
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            ./build-vkd3d/ps3recomp_boot_smoke build-vkd3d/smoke/smoke.elf 2>&1 | tee smoke-vkd3d.log
          grep -q "\[D3D12\] vkd3d: llvmpipe" smoke-vkd3d.log
          grep -q "\[D3D12\] Backend ready" smoke-vkd3d.log
          grep -q "frames presented: 3" smoke-vkd3d.log
          grep -q "\[smoke\] PASS" smoke-vkd3d.log

      # ---- build-hal: the portable renderer without vkd3d (push to master, manual run) ----------------------

      # As a Linux build without vkd3d has it: the switch then has null and vulkan only (test_rsx_out.c's
      # stand-ins). The Vulkan tests ran on build-routes above, against the same backend.
      - name: Portable renderer without vkd3d, configure and build
        id: hal_build
        if: ${{ !cancelled() && matrix.build_type == 'Release' && github.event_name != 'pull_request' && steps.deps.outcome == 'success' }}
        run: |
          cmake -S . -B build-hal -G Ninja -DCMAKE_BUILD_TYPE=Release -DPS3RECOMP_RSX_HAL=ON $GPU_SRC_ARGS \
            | tee configure-hal.log
          grep -q "Renderer: *the GPU layer's Vulkan backend" configure-hal.log
          grep -q "Renderer: *the compile service's spv target" configure-hal.log
          cmake --build build-hal --target ps3recomp_runtime test_gpu_contract test_gpu_null test_gpu_sc_spv \
            test_gpu_vk test_rsx_synth test_rsx_out

      - name: Portable renderer without vkd3d, the tests with no display
        if: ${{ !cancelled() && matrix.build_type == 'Release' && github.event_name != 'pull_request' && steps.hal_build.outcome == 'success' }}
        run: |
          ctest --test-dir build-hal -R gpu_contract --output-on-failure --no-tests=error
          ctest --test-dir build-hal -R gpu_null --output-on-failure --no-tests=error
          ctest --test-dir build-hal -R gpu_sc_spv --output-on-failure --no-tests=error
          ctest --test-dir build-hal -R rsx_out -V --no-tests=error
          ctest --test-dir build-hal -R rsx_synth -V --no-tests=error

      # ---- build: the runtime as a port links it today ------------------------------------------------------

      # glslang and spirv-cross are what the Metal backend's guest-shader path translates with. There is no Metal
      # here, but the translation itself has no GPU in it, so Linux is where the decompilers' HLSL meets glslang's
      # front end on every push. glslang-tools is not used, but Ubuntu's glslang CMake config declares the
      # standalone binary as an imported target and refuses to load while /usr/bin/glslang is absent. spirv-tools
      # is what glslang's HLSL legalization runs on (the Vulkan backend below).
      - name: Install the shader tools (glslang, spirv-cross)
        id: tools
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          sudo apt-get install -y glslang-dev glslang-tools spirv-tools libspirv-cross-c-shared-dev

      - name: Configure
        id: cfg
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.cfg.outcome == 'success' }}
        run: cmake --build build

      - name: Verify the archive exists and is x86-64
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          test -f build/libps3recomp_runtime.a
          file build/libps3recomp_runtime.a
          # An archive links nothing, so a bad extern survives the build. Catch
          # the undefined symbols the compiler let through -- this is exactly
          # how pthread_threadid_np hid from GCC.
          nm --undefined-only build/libps3recomp_runtime.a \
            | awk '{print $2}' | sort -u > /tmp/undef.txt
          if grep -qE '^(pthread_threadid_np|QueryPerformance|GetTickCount64)' /tmp/undef.txt; then
            echo "Win32/Darwin-only symbol left undefined in a POSIX build:"
            grep -E '^(pthread_threadid_np|QueryPerformance|GetTickCount64)' /tmp/undef.txt
            exit 1
          fi

      # The Python suites are the project's real correctness net -- the
      # conformance one compiles and runs 1300+ lifted instruction cases with
      # the host compiler, so it is genuinely testing this platform's codegen
      # and not just re-checking the lifter's Python.
      - name: Set up Python
        id: py
        if: ${{ !cancelled() }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run the lifter test suites
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        env:
          CI: "1"          # makes a skipped conformance run fail instead of passing
        run: |
          set -e
          unset CC CXX   # the suites take $CC/$CXX, else cc and c++: the system compiler, as before
          for t in tools/test_*.py; do
            echo "--- $t"
            python "$t"
          done

      - name: Run self-contained SPU helper tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} \
            -std=gnu17 -I include -I runtime/spu \
            -o /tmp/test_spu_helpers runtime/spu/tests/test_spu_helpers.c -lm
          /tmp/test_spu_helpers
          # The SSE4.1 paths against their scalar forms (as arm64 runs them
          # through sse2neon on macOS).
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} \
            -std=gnu17 -msse4.1 -I include -I runtime/spu \
            -o /tmp/test_spu_simd_paths runtime/spu/tests/test_spu_simd_paths.c -lm
          /tmp/test_spu_simd_paths

      # libnet over host sockets (PS3_NET_ONLINE), end to end on loopback: every
      # handler is called through the NID it registered under.
      - name: Run the sys_net loopback test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -I include -o /tmp/test_sys_net libs/network/tests/test_sys_net.c
          /tmp/test_sys_net

      # mbedTLS (third_party/mbedtls) as a static library, once, for the
      # network tests below: they include ps3_tls.c, the TLS to the online
      # server.
      - name: Build mbedTLS for the network tests
        id: mbedtls
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          mkdir -p /tmp/mbedtls
          cd /tmp/mbedtls
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -O2 -w -c -I "$GITHUB_WORKSPACE/third_party/mbedtls/include" "$GITHUB_WORKSPACE"/third_party/mbedtls/library/*.c
          ar rcs /tmp/libmbedtls.a /tmp/mbedtls/*.o

      # TLS to the online server (ps3_tls.c) on loopback with test
      # certificates: the built-in roots, the certificate and name checks,
      # a server that isn't TLS, timeouts, large transfers.
      - name: Run the TLS test
        if: ${{ !cancelled() && steps.mbedtls.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -I include -I third_party/mbedtls/include -o /tmp/test_net_tls libs/network/tests/test_net_tls.c /tmp/libmbedtls.a -lpthread
          /tmp/test_net_tls

      # cellHttp end to end on loopback: guest pointers, the network gate, and
      # PS3_HTTP_HEADER's extra header.
      - name: Run the cellHttp loopback test
        if: ${{ !cancelled() && steps.mbedtls.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -I include -I third_party/mbedtls/include -o /tmp/test_http_loopback libs/network/tests/test_http_loopback.c third_party/monocypher/monocypher.c third_party/monocypher/monocypher-ed25519.c /tmp/libmbedtls.a -lpthread
          /tmp/test_http_loopback

      # The sign-in to a server that has one: the key, the challenge and its
      # work, the session on cellHttp's requests to that server only. Then
      # what the player is told when psnr refuses co-op.
      - name: Run the sign-in tests
        if: ${{ !cancelled() && steps.mbedtls.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -I include -I third_party/mbedtls/include -o /tmp/test_net_signin libs/network/tests/test_net_signin.c third_party/monocypher/monocypher.c third_party/monocypher/monocypher-ed25519.c /tmp/libmbedtls.a -lpthread
          /tmp/test_net_signin
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -I include -I third_party/mbedtls/include -o /tmp/test_np_psnr_notice libs/network/tests/test_np_psnr_notice.c third_party/monocypher/monocypher.c third_party/monocypher/monocypher-ed25519.c /tmp/libmbedtls.a -lpthread
          /tmp/test_np_psnr_notice

      # cellL10n's UTF8toUTF16 at guest addresses: one character per call,
      # big-endian units, the byte count returned.
      - name: Run the cellL10n test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -I include -o /tmp/test_l10n libs/font/tests/test_l10n.c
          /tmp/test_l10n

      # Matching2 over psnr without a server: response relocation, attribute
      # packing, and the room structs a title reads.
      - name: Run the Matching2 test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -I include -o /tmp/test_np_matching2 libs/network/tests/test_np_matching2.c
          /tmp/test_np_matching2

      # The player name: --username, PS3_NP_ONLINE_ID, the OS login online,
      # and PSN's online ID rules.
      - name: Run the player-name test
        if: ${{ !cancelled() && steps.mbedtls.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -I include -I third_party/mbedtls/include -o /tmp/test_np_identity libs/network/tests/test_np_identity.c third_party/monocypher/monocypher.c third_party/monocypher/monocypher-ed25519.c /tmp/libmbedtls.a -lpthread
          /tmp/test_np_identity

      # NAT traversal: probing psnr from the P2P socket, dropping psnr's
      # packets before the title sees them, punching toward peers.
      - name: Run the NAT traversal test
        if: ${{ !cancelled() && steps.mbedtls.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -I include -I third_party/mbedtls/include -o /tmp/test_np_nat libs/network/tests/test_np_nat.c third_party/monocypher/monocypher.c third_party/monocypher/monocypher-ed25519.c /tmp/libmbedtls.a -lpthread
          /tmp/test_np_nat

      # Where an EDAT/SDAT file's plaintext comes from: the player's decrypted
      # copy (PS3_EDAT_PLAIN), a cache folder (PS3_EDAT_CACHE) or beside the
      # source, on an SDAT the test makes with edat.c's own AES.
      - name: Run the EDAT path test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -Wall -Wextra -I include -I libs/filesystem -o /tmp/test_edat_paths libs/filesystem/tests/test_edat_paths.c
          /tmp/test_edat_paths

      # Every guest path passes the same checks before it becomes a host path
      # (include/ps3emu/vfs_path.h): no '..' above the root, no ':', control
      # characters or Windows device names.
      - name: Run the guest path test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -Wall -Wextra -I include -o /tmp/test_vfs_path libs/filesystem/tests/test_vfs_path.c
          /tmp/test_vfs_path

      # A host stick to the PS3's axis bytes: the radial deadzone and RPCS3's
      # squircling (pad_stick.h), on directions, lengths and the deadzone's edge.
      - name: Run the stick conversion test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -Wall -Wextra -I libs/input -o /tmp/test_pad_stick libs/input/tests/test_pad_stick.c -lm
          /tmp/test_pad_stick

      # Guest vertex and fragment programs through the decompilers, glslang
      # and spirv-cross: asserts the MSL carries the buffer, texture, sampler
      # and attribute slots the Metal backend binds to. The binary missing
      # means the shader tools were not found, which must fail, not skip.
      - name: Run the guest shader translation test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          test -x build/test_shader_msl
          ./build/test_shader_msl

      # runtime/ppu/ is the one part of the runtime no CMake target builds --
      # it needs the lifter's per-game ppu_recomp.h -- so nothing here ever
      # compiled it and the POSIX port is unfinished. This ratchets the error
      # count: it fails if the scaffold gets WORSE, which is what keeps the
      # port from sliding backwards while it is being done.
      - name: Check the PPU boot scaffold (ratchet)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        env:
          CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
        run: python tools/check_ppu_scaffold.py

      # ...and this one RUNS it, which the ratchet cannot. The smoke title is a
      # synthetic lifted program that drives the loader, the NID bridge, the
      # lv2 syscalls, a guest thread, the frame clock and the RSX backend from
      # guest code and checks all of it; here the backend is the null one's
      # headless software path, so no GPU and no display are involved. Exit 0
      # means every marker appeared in order, the guest thread ran on its own
      # host thread, three frames reached the backend and the guest's chosen
      # exit status came back through sys_process_exit. The binary missing
      # means CMake skipped the target, which must fail rather than pass.
      - name: Run the PPU boot smoke title (null backend)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          test -x build/ps3recomp_boot_smoke
          ./build/ps3recomp_boot_smoke build/smoke/smoke.elf

      # templates/project is what "start a port" means -- docs/GETTING_STARTED.md
      # says to copy it -- and until now nothing built it on any platform. This
      # is the same smoke title again, booted through the TEMPLATE's runner and
      # the template's own CMakeLists: the toolkit from PS3RECOMP_DIR, the lift
      # from RECOMP_DIR, exactly the two directories a real port passes. Exit 0
      # is the smoke title's own verdict, so a template that builds but boots
      # nothing cannot pass. Linux is also where the template's null-backend
      # branch is the one that runs.
      - name: Build and run the game template (null backend)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # pipefail, or tee below would swallow the runner's exit status --
          # which IS the smoke title's verdict.
          set -eo pipefail
          test -f build/smoke/lift/ppu_recomp.h
          cmake -S templates/project -B build-template -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DPS3RECOMP_DIR="$PWD" \
            -DRECOMP_DIR="$PWD/build/smoke/lift"
          cmake --build build-template
          ./build-template/MyGameRecomp build/smoke/smoke.elf 2>&1 | tee template.log
          # The runner's own banner, so a pass cannot come from some other
          # binary, and the marker-order verdict spelt out rather than inferred
          # from the exit status alone.
          grep -q "=== ps3recomp game runner ===" template.log
          grep -q "\[smoke\] OK: all 11 markers, in order" template.log
          grep -q "\[smoke\] PASS" template.log

      # Drives a real NV4097 command buffer through cellGcm -> RSX -> the null
      # backend's headless software path and asserts the presented pixel. No
      # display and no GPU are involved, so exit 0 means the whole graphics
      # bridge is intact on Linux, not merely that it compiled.
      - name: Run the POSIX host (headless end-to-end)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # Clear + flip: asserts the guest clear colour reaches the framebuffer.
          ./build/ps3recomp_host
          # Clear + a real NV4097 draw: asserts the triangle covers the centre
          # pixel, which exercises guest vertex fetch, primitive expansion and
          # the draw path, not just the clear.
          ./build/ps3recomp_host --draw
          ./build/ps3recomp_host --draw --frames=60
          # Two triangles drawn near-first: the centre pixel is red only if the
          # depth test rejected the later far one.
          ./build/ps3recomp_host --depth
          # Bind a texture and sample it: the quad is green, the texture is
          # not, so a path that dropped the texture still draws something
          # plausible and still fails here. Exercises rsx_texture_layout and
          # rsx_texture_decode end to end with no GPU involved.
          ./build/ps3recomp_host --tex
          # The same texture after the guest also derived a VRAM offset in its
          # 1 MB page number: the texture says main memory, so it must still
          # resolve through the IO map rather than into VRAM.
          ./build/ps3recomp_host --tex-io
          # A polygon and a quad strip, neither of which any host API draws:
          # both have to be expanded into triangles first. The pentagon is
          # green and the strip red over it, and the centre pixel belongs to
          # the strip's second quad, so a dropped or half-expanded strip is
          # green and fails.
          ./build/ps3recomp_host --quads
          # No graphics: create a guest PPU thread through the lv2 path and
          # check the host stack it got. A recompiled call chain nests on the
          # host stack one frame per guest call, so the default stack is not
          # enough and nothing says so until a title dies with no diagnosis.
          ./build/ps3recomp_host --threads
          # The SDL2 audio and pad backends, which the Windows build never
          # reaches (it takes WASAPI and XInput). The dummy audio driver and
          # no controller are the runner's situation and must both be fine.
          SDL_AUDIODRIVER=dummy ./build/ps3recomp_host --audio-pad

      # RSX texture layout -- format class, row sizes, Morton addressing. Pure
      # arithmetic with no host API in it, so it runs everywhere, and it is the
      # regression net for having lifted that maths out of the D3D12 uploader.
      - name: Run self-contained RSX tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -Wall -Wextra -I include -I libs/video -o /tmp/test_texture_layout libs/video/tests/test_texture_layout.c libs/video/rsx_texture_layout.c
          /tmp/test_texture_layout
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -Wall -Wextra -I include -I libs/video -o /tmp/test_rsx_primitives libs/video/tests/test_rsx_primitives.c
          /tmp/test_rsx_primitives
          # The fragment-program decoder on its own: the word swap, source
          # swizzles and types, the dest mask, inline constants, which
          # register file the colour export comes from, and how many
          # SV_TARGETs a program that writes more than one export gets. It
          # had rotted to the point of not compiling while nothing ran it.
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -Wall -Wextra -I include -o /tmp/test_fp_decompiler libs/video/tests/test_fp_decompiler.c libs/video/rsx_fp_decompiler.c
          /tmp/test_fp_decompiler
          # The register-file draw engine's platform-neutral halves, driven
          # through its dispatch sink against a stub backend: the surface set's
          # keying and reallocation, a texture unit that names a render target
          # sampling it rather than guest memory, the texture cache's
          # once-per-frame revalidation and its LRU eviction, the pipeline key
          # holding still while constants change, and restart cuts bounding
          # every topology expansion. No GPU and no host graphics API, so this
          # is where those get checked at all.
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -Wall -Wextra -Wno-unused-parameter -I include -I libs/video -o /tmp/test_rsx_draw_engine libs/video/tests/test_rsx_draw_engine.c libs/video/rsx_draw_engine.c libs/video/rsx_dispatch.c libs/video/rsx_vertex_compact.c libs/video/rsx_texture_layout.c libs/video/rsx_vp_decompiler.c libs/video/rsx_fp_decompiler.c
          /tmp/test_rsx_draw_engine
          # The NV4097 method decoder on its own: the vertex-constant window is
          # 32 dwords and the registers after it are not constants.
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -Wall -Wextra -I include -I libs/video -o /tmp/test_rsx_transform_constants libs/video/tests/test_rsx_transform_constants.c libs/video/rsx_commands.c
          /tmp/test_rsx_transform_constants

      # The Win32 shim every POSIX host runs the runtime through: interlocked
      # widths and return conventions, SRW/CS/condition variables, events,
      # semaphores, joinable threads, WaitOnAddress, timers, VirtualAlloc.
      - name: Run the Win32 compatibility layer tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -Wall -Wextra -I runtime/platform -o /tmp/test_win32_compat runtime/platform/tests/test_win32_compat.c runtime/platform/win32_compat.c -lpthread
          /tmp/test_win32_compat

      # Which signal an inaccessible guest window faults with, and whether one
      # can be reserved at all. runtime/ppu/ppu_loader.cpp's untranslated-guest-
      # pointer trap takes both SIGSEGV and SIGBUS because the two hosts answer
      # that differently; this is the evidence, and it needs no game, so it is
      # the one thing about that trap CI can actually run.
      - name: Run the guest-pointer trap signal test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -Wall -Wextra -o /tmp/test_guest_ptr_trap runtime/platform/tests/test_guest_ptr_trap.c
          /tmp/test_guest_ptr_trap

      # The lv2 sync-primitive stress suite (mutex, cond, semaphore, event
      # queue) on host threads. It was Windows-only until the shim grew joinable
      # handles and multi-object waits; here it is the memory-model regression
      # net for the same primitives a game hammers.
      - name: Build and run sync_stress
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          unset CC CXX   # the system compiler, as before
          cmake -S tests/sync_stress -B build-sync-stress -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build build-sync-stress
          ctest --test-dir build-sync-stress --output-on-failure

      # runtime/platform/plat.h's threads, events and mutex, and the SPU async
      # job pool written once on them. Off Windows the pool used to be a thread
      # per job; this shows it reuses workers, keeps no queue, lets idle ones
      # go and reserves the 256 MB stacks, on this host's own pthreads. Its
      # plat_time test checks plat.h's clock and precise sleep.
      - name: Build and run plat_threads
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          cmake -S tests/plat_threads -B build-plat-threads -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build build-plat-threads
          ctest --test-dir build-plat-threads --output-on-failure

      # The guest clocks and the guest's usleep (runtime/syscalls/sys_timer.c,
      # on plat.h's clock and precise sleep): both clocks count from their
      # first reading, as on Windows, and a one-off usleep under a millisecond
      # never ends early. -V prints requested against measured sleeps.
      - name: Build and run lv2_time
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          cmake -S tests/lv2_time -B build-lv2-time -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build build-lv2-time
          ctest --test-dir build-lv2-time --output-on-failure -V

      # cellFiber's cooperative switching on ucontext. glibc's ucontext_t is
      # not the one that bites, but running the suite on both hosts is what
      # tells a Darwin header problem from a logic error in the switch.
      - name: Build and run fiber_switch
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          unset CC CXX   # the system compiler, as before
          cmake -S tests/fiber_switch -B build-fiber -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build build-fiber
          ./build-fiber/fiber_switch

      # An SPU parked on a GETLLAR reservation has to be told when the PPU
      # writes that line. Nothing else in the tree fails when that notify is
      # missing -- the SPU just never wakes -- so it gets its own check.
      - name: Run the PPU/SPU lock-line coherence tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -I include -I runtime/spu \
                -o /tmp/test_spu_coherency runtime/spu/tests/test_spu_coherency.c
          /tmp/test_spu_coherency

      # The host inflate that replaces an SPU title's lifted zlib: its output
      # has to be zlib's byte for byte, and a bad stream has to fail cleanly.
      - name: Run the raw inflate tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -Wall -I include -I runtime/spu \
                -o /tmp/test_spu_inflate runtime/spu/tests/test_spu_inflate.c
          /tmp/test_spu_inflate

      # The other writer: an SPU. Five SPURS kernels share one management line,
      # so a commit that does not break its peers' reservations lets two of them
      # win the same compare-and-swap, and the queue is quietly wrong afterwards.
      - name: Run the SPU-to-SPU lock-line coherence tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -I include -I runtime/spu -I runtime/platform \
            -o /tmp/test_spu_lockline_peer \
            runtime/spu/tests/test_spu_lockline_peer.c \
            runtime/spu/spu_drain.c runtime/spu/spu_lockstep.c \
            runtime/spu/spu_coherency.c runtime/spu/spu_workload.c \
            runtime/spu/spurs_policy.c runtime/spu/spurs_job.c \
            runtime/spu/spu_tsp_weak.c runtime/spu/spu_vm_pagemap.c \
            runtime/spu/spurs_policy_blob_weak.c runtime/spu/spu_interp.c \
            runtime/spu/spu_async_pool.c runtime/platform/plat_posix.c \
            runtime/platform/win32_compat.c \
            -lpthread -lm
          /tmp/test_spu_lockline_peer

      # A task parked in WAIT_SIGNAL, signalled by another SPU. libspurs does
      # that with PUTLLC on the taskset line, which never woke the parked
      # task's host thread: it saw the signal only when its 1 s wait timed out.
      - name: Run the SPURS task wake test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -I include -I runtime/spu -I runtime/platform \
            -o /tmp/test_spu_taskset_wake \
            runtime/spu/tests/test_spu_taskset_wake.c \
            runtime/spu/spu_drain.c runtime/spu/spu_lockstep.c \
            runtime/spu/spu_coherency.c runtime/spu/spu_workload.c \
            runtime/spu/spurs_policy.c runtime/spu/spurs_job.c \
            runtime/spu/spu_tsp_weak.c runtime/spu/spu_vm_pagemap.c \
            runtime/spu/spurs_policy_blob_weak.c runtime/spu/spu_interp.c \
            runtime/spu/spu_async_pool.c runtime/platform/plat_posix.c \
            runtime/platform/win32_compat.c \
            -lpthread -lm
          /tmp/test_spu_taskset_wake

      # A thread group starting its threads on their image's LIFTED code. This
      # is the path a real title needs and the one that used to be missing: the
      # group's threads completed instantly with status 0, the group reported a
      # clean exit, and the program the guest asked to run had simply not run.
      # Nothing else in the tree fails when that happens, so it gets its own
      # check. The real lv2 SPU-thread layer and the real SPU dispatcher are
      # compiled in, and the two threads have to run concurrently on host
      # threads of their own, with the image in their local stores, the entry
      # point and image the registry says, and each thread's own arguments.
      - name: Run the lifted SPU thread-group start test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -I include -I runtime/spu -I runtime/platform \
            -o /tmp/test_spu_lifted_start \
            runtime/spu/tests/test_spu_lifted_start.c \
            runtime/spu/spu_channels.c runtime/spu/spu_drain.c \
            runtime/spu/spu_lockstep.c runtime/spu/spu_coherency.c \
            runtime/spu/spu_workload.c runtime/spu/spurs_policy.c \
            runtime/spu/spurs_job.c runtime/spu/spu_tsp_weak.c \
            runtime/spu/spu_vm_pagemap.c runtime/spu/spurs_policy_blob_weak.c \
            runtime/spu/spu_interp.c runtime/spu/spu_lifted_thread.c \
            runtime/syscalls/spu_fallback.c runtime/syscalls/sdk_version_weak.c \
            runtime/spu/spu_async_pool.c runtime/platform/plat_posix.c \
            runtime/platform/win32_compat.c \
            -lpthread -lm
          /tmp/test_spu_lifted_start

      # The per-context MFC engine table, which the group above writes from
      # every one of its threads at once. Two threads claiming the same slot
      # share one engine's queue and tag mask, so one SPU's tag wait is
      # satisfied by the other's transfer and nothing says so; slots that are
      # never given back put every context past the eighth on one shared
      # engine. Eight contexts claim on the same instant, thirty-two times
      # over, and the check is that the same eight engines come back around,
      # each one clean and holding only its own owner's state.
      - name: Run the SPU MFC engine slot test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -I include -I runtime/spu -I runtime/platform \
            -o /tmp/test_spu_mfc_slots \
            runtime/spu/tests/test_spu_mfc_slots.c \
            runtime/spu/spu_drain.c runtime/spu/spu_lockstep.c \
            runtime/spu/spu_coherency.c runtime/spu/spu_workload.c \
            runtime/spu/spurs_policy.c runtime/spu/spurs_job.c \
            runtime/spu/spu_tsp_weak.c runtime/spu/spu_vm_pagemap.c \
            runtime/spu/spurs_policy_blob_weak.c runtime/spu/spu_interp.c \
            runtime/spu/spu_async_pool.c runtime/platform/plat_posix.c \
            runtime/platform/win32_compat.c \
            -lpthread -lm
          /tmp/test_spu_mfc_slots

      # ---- build-vulkan: the opt-in Vulkan RSX backend ------------------------------------------------------

      # Every ps3recomp_host scene on lavapipe (a CPU Vulkan driver), in two passes, one per draw path:
      #   - without guest programs, the rsx_state vtable's fixed-function path: the same scenes the null backend
      #     ran above, now through Vulkan;
      #   - with guest programs, the shared register-file draw engine (the path the Metal backend takes): all
      #     twelve draw scenes, including the ones only a translating backend can pass (--shader, --mip, --rtt,
      #     --depthtex, --mrt, --mrt-a, --cube), under the Khronos validation layer.
      # The configure must find glslang, or the second pass would only ever skip.
      - name: Vulkan backend, configure and build
        id: vk_build
        if: ${{ !cancelled() && matrix.build_type == 'Release' && steps.tools.outcome == 'success' }}
        run: |
          cmake -S . -B build-vulkan -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPS3RECOMP_RSX_VULKAN=ON | tee configure-vulkan.log
          grep -q "Vulkan: *guest programs available" configure-vulkan.log
          cmake --build build-vulkan --target ps3recomp_host

      - name: Vulkan backend, fixed-function path (no guest programs)
        if: ${{ !cancelled() && matrix.build_type == 'Release' && steps.vk_build.outcome == 'success' }}
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          fail=0
          for m in "" "--draw" "--draw --frames=60" "--depth" "--tex" "--tex-io" "--quads" "--threads"; do
            rc=0; ./build-vulkan/ps3recomp_host $m > run.log 2>&1 || rc=$?
            echo "::group::ps3recomp_host ${m:-(default)} -> exit $rc"; cat run.log; echo "::endgroup::"
            [ "$rc" -eq 0 ] || { echo "::error::${m:-default}: exit $rc"; fail=1; }
          done
          exit $fail

      # Fails on any of: a scene's own check, a single validation message, a scene that did not take the engine
      # path, or one that reported "nothing to check" -- a skipped scene is not a passed one.
      - name: Vulkan backend, draw engine with guest programs, under the validation layer
        if: ${{ !cancelled() && matrix.build_type == 'Release' && steps.vk_build.outcome == 'success' }}
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          PS3RECOMP_VK_GUEST_PROGRAMS: "1"
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          fail=0
          # --threads is not here: it checks guest thread stacks and returns
          # before any backend exists (the first pass still runs it).
          for m in "" "--draw" "--depth" "--quads" "--shader" \
                   "--tex" "--tex-io" "--mip" "--rtt" "--depthtex" "--mrt" "--mrt-a" "--cube"; do
            rc=0; ./build-vulkan/ps3recomp_host $m > run.log 2>&1 || rc=$?
            name=${m:-default}
            echo "::group::ps3recomp_host $name -> exit $rc"; cat run.log; echo "::endgroup::"
            [ "$rc" -eq 0 ] || { echo "::error::$name: exit $rc"; fail=1; }
            if grep -q "VUID" run.log; then echo "::error::$name: Vulkan validation messages"; fail=1; fi
            grep -q "register-file draw engine path" run.log || { echo "::error::$name: not on the draw engine"; fail=1; }
            if grep -q "nothing to check" run.log; then echo "::error::$name: skipped, not checked"; fail=1; fi
          done
          exit $fail

      # ---- build-codec: the movies with FFmpeg ---------------------------------------------------------------

      # cellSail's movies off Windows: MPEG-2 through FFmpeg loaded at run
      # time, on a PAMF file the test encodes and writes itself (B-frames,
      # pictures split across PES packets, LPCM split mid-sample), with the
      # cellVdec and cellPamf tests next to it. It needs the FFmpeg libraries,
      # not the ffmpeg program (without that the cellVdec decode tests are not
      # added). The movie test missing means CMake did not find the libraries,
      # which must fail, not skip.
      - name: Run the codec tests with FFmpeg (movies)
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          sudo apt-get install -y libavcodec-dev
          cmake -S . -B build-codec -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DPS3RECOMP_BUILD_TESTS=ON -DPS3RECOMP_FFMPEG_RUNTIME=ON
          cmake --build build-codec --target test_sail_movie test_vdec_stub test_vdec_ffmpeg test_cellPamf
          ctest --test-dir build-codec -N -R sail_movie_play | grep -q sail_movie_play
          ctest --test-dir build-codec -R "sail_movie|vdec|pamf" --output-on-failure

      # ---- sccache: its counts, and its cache from a push to master -------------------------------------------

      - name: sccache's counts
        if: ${{ !cancelled() && steps.sccache.outcome == 'success' }}
        run: |
          sccache --show-stats
          sccache --stop-server || true

      - name: Save sccache's cache
        if: ${{ !cancelled() && steps.sccache.outcome == 'success' && github.event_name == 'push' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.ci-cache/sccache
          key: sccache-${{ runner.os }}-clang-Release-${{ github.sha }}
